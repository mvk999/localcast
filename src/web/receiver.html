<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>LocalCast TV</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body class="receiver-body">
    <main id="receiver-card" class="card receiver-card">
      <h1>LOCALCAST</h1>
      <p class="eyebrow">Código de conexão</p>
      <output id="code" class="tv-code">··· ···</output>
      <p id="status" class="status">Preparando conexão…</p>
      <p id="diagnostic" class="note"></p>
    </main>
    <video id="video" autoplay muted playsinline></video>
    <aside id="debug-panel" class="debug-panel" hidden aria-live="polite"></aside>
    <div id="play-overlay" class="play-overlay" hidden>
      <p>Transmissão recebida.</p>
      <button id="play-button">▶ Iniciar vídeo</button>
      <p id="play-result" class="play-result" role="status"></p>
    </div>
    <script type="module" src="/receiver.js"></script>
  </body>
</html>
